# Runs the same `make` targets used locally, so CI and development never diverge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Backend lint + types, backend tests, frontend lint + types
        run: make check

  system:
    name: Full system, API collection and E2E
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the system (production images)
        run: make up
      - name: Bruno collection against the API
        run: make api-collection
      - name: Playwright end-to-end tests
        run: make e2e
        env:
          CI: "true"
      - name: Service logs
        if: failure()
        run: docker compose logs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
